name: status-probe

# Runs in the public zencodeinc/hydracept-status repo (free Pages + Actions minutes).
# Probe state lives on orphan branch probe-data (not main).

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. GitHub bills a minimum of one full minute per job, so a
    # 5-minute schedule billed ~100 minutes/day for ~10 minutes of probe work.
    # Prod coloc dispatches this workflow on that same cadence and skips a
    # dispatch when any run is younger than the interval. A leftover */5
    # crontab must not start another probe.
    - cron: "*/30 * * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: status-probe
  # A run stuck on the github-pages environment wait does not count against the
  # job timeout. cancel-in-progress lets the next probe start instead of
  # queueing behind that wait. The Pages deployment key is the probe-data
  # SHA from the build job, not this repo's main commit.
  cancel-in-progress: true

jobs:
  honesty:
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-status-probe.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Node test deps
        run: npm ci
      - name: Status honesty tests (Node)
        run: npm test
      - name: Status probe tests (Python)
        run: python -m pytest tests/python -q

  build:
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pages_build_version: ${{ steps.probe_push.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python probe dependencies
        run: python -m pip install -r requirements-status-probe.txt
      - name: Load probe state (probe-data branch or bootstrap)
        run: |
          python scripts/status_git_probe_data.py \
            --repo-dir . \
            --bootstrap bootstrap/probe-state.json \
            --dest data/probe-state.json
      - name: Run external probes (keyless)
        run: |
          python scripts/status_probe.py \
            --state data/probe-state.json \
            --write data/probe-state.json
      - name: Stage GitHub Pages artifact
        run: |
          python scripts/status_pages_build.py \
            --out _site \
            --state data/probe-state.json \
            --public-dir .
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Push probe state (probe-data branch)
        id: probe_push
        # The push has to succeed. Its commit SHA is the Pages build version.
        # Continuing after a failed push used to deploy main's unchanged SHA,
        # and GitHub reported that old deployment as already successful.
        run: |
          python scripts/status_git_probe_data.py \
            --repo-dir . \
            --state data/probe-state.json \
            --push | tee "$RUNNER_TEMP/probe-push.txt"
          sha=$(awk '/^pages_build_version / { print $2 }' "$RUNNER_TEMP/probe-push.txt")
          case "$sha" in
            ????????????????????????????????????????) ;;
            *)
              echo "probe-data did not publish a full commit sha" >&2
              exit 1
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1' && needs.build.outputs.pages_build_version != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      # Two runner rules, both already failed in production:
      # 1. A step env map cannot replace GITHUB_SHA. Run 42571703029 set it
      #    to probe-data ae9f21d4 and deploy-pages still sent main af337fe8.
      #    Pages treated that SHA as an already-successful deployment, so
      #    status.json stayed at 2026-11-07.
      # 2. ACTIONS_RUNTIME_TOKEN is injected only into an action process.
      #    Run 42875056248 (workflow be8e07f, 2026-11-10T18:25:32Z) exported
      #    probe-data f08facac and then started the bundle with node. The
      #    token was missing and Pages returned 500.
      # This step is a node20 action. It assigns the probe-data SHA to
      # process.env.GITHUB_SHA and loads the pinned bundle in that same
      # process. Keep the probe-data SHA. Do not publish main's SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Deploy GitHub Pages at the probe-data commit
        id: deployment
        uses: ./.github/actions/deploy-pages-at-sha
        with:
          pages_build_version: ${{ needs.build.outputs.pages_build_version }}
          deploy_pages_pin: "d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"
