name: status-probe

# Runs in the public zencodeinc/hydracept-status repo (free Pages + Actions minutes).
# Probe state lives on orphan branch probe-data (not main).

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. GitHub bills a minimum of one full minute per job, so a
    # 5-minute schedule billed ~100 minutes/day for ~10 minutes of probe work.
    # Prod coloc dispatches this workflow on the same 30-minute cadence.
    - cron: "*/30 * * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: status-probe
  # A run stuck on the github-pages environment wait does not count against the
  # job timeout. cancel-in-progress lets the next probe start. It does not
  # publish status.json: deploy-pages keys the deployment on GITHUB_SHA, and
  # this repo's main commit does not change when a probe runs.
  cancel-in-progress: true

jobs:
  honesty:
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-status-probe.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Node test deps
        run: npm ci
      - name: Status honesty tests (Node)
        run: npm test
      - name: Status probe tests (Python)
        run: python -m pytest tests/python -q

  build:
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pages_build_version: ${{ steps.probe_push.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python probe dependencies
        run: python -m pip install -r requirements-status-probe.txt
      - name: Load probe state (probe-data branch or bootstrap)
        run: |
          python scripts/status_git_probe_data.py \
            --repo-dir . \
            --bootstrap bootstrap/probe-state.json \
            --dest data/probe-state.json
      - name: Run external probes (keyless)
        run: |
          python scripts/status_probe.py \
            --state data/probe-state.json \
            --write data/probe-state.json
      - name: Stage GitHub Pages artifact
        run: |
          python scripts/status_pages_build.py \
            --out _site \
            --state data/probe-state.json \
            --public-dir .
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Push probe state (probe-data branch)
        id: probe_push
        # The push has to succeed. Its commit SHA is the Pages build version.
        # Continuing after a failed push used to deploy main's unchanged SHA,
        # and GitHub reported that old deployment as already successful.
        run: |
          python scripts/status_git_probe_data.py \
            --repo-dir . \
            --state data/probe-state.json \
            --push | tee "$RUNNER_TEMP/probe-push.txt"
          sha=$(awk '/^pages_build_version / { print $2 }' "$RUNNER_TEMP/probe-push.txt")
          case "$sha" in
            ????????????????????????????????????????) ;;
            *)
              echo "probe-data did not publish a full commit sha" >&2
              exit 1
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1' && needs.build.outputs.pages_build_version != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        env:
          # pages_build_version is GITHUB_SHA, and it has to be a commit that
          # exists. A synthetic string 404s. hydracept-status main is still
          # 043afe1 (2026-10-13), so every scheduled probe reused that
          # deployment and GitHub returned it as already successful. The
          # artifact from run 42499797863 already contains generated_at
          # 2026-11-08T16:25:49Z; the served file stayed at 2026-11-07. The
          # probe-data commit is a new sha in this repo. This file is not what
          # Pages runs until sync-hydracept-status pushes it to that repo.
          GITHUB_SHA: ${{ needs.build.outputs.pages_build_version }}
