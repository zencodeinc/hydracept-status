name: status-probe

# Runs in the public zencodeinc/hydracept-status repo (free Pages + Actions minutes).
# Probe state lives on orphan branch probe-data (not main).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: status-probe
  cancel-in-progress: false

jobs:
  build:
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-status-probe.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Node test deps
        run: npm ci
      - name: Status honesty tests (Node)
        run: npm test
      - name: Status probe tests (Python)
        run: python -m pytest tests/python -q
      - name: Load probe state (probe-data branch or bootstrap)
        run: |
          python scripts/status_git_probe_data.py \
            --repo-dir . \
            --bootstrap bootstrap/probe-state.json \
            --dest data/probe-state.json
      - name: Run external probes (keyless)
        run: |
          python scripts/status_probe.py \
            --state data/probe-state.json \
            --write data/probe-state.json
      - name: Stage GitHub Pages artifact
        run: |
          python scripts/status_pages_build.py \
            --out _site \
            --state data/probe-state.json \
            --public-dir .
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Push probe state (probe-data branch)
        run: |
          python scripts/status_git_probe_data.py \
            --repo-dir . \
            --state data/probe-state.json \
            --push

  deploy:
    needs: build
    if: vars.HYDRACEPT_STATUS_PAGES_LIVE == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
